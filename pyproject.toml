[project]
name = "enauczanie-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing a student's eNauczanie PG (Moodle) account to Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.urls]
Repository = "https://github.com/Zambrzyckii/enauczanie-mcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["enauczanie_mcp"]
